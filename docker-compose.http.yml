# HTTP mode (self-host) -- use with:
# docker compose -f docker-compose.http.yml up
# Published on host loopback only; put your own TLS reverse proxy in front.
# Auth: MCP_AUTH_MODE=multi (default, per-user tokens via MCP_USERS_FILE) or
# MCP_AUTH_MODE=token (single shared bearer; MCP_AUTH_TOKEN_HASH required).
services:
  notion:
    build:
      context: .
      target: http
    environment:
      - MCP_TRANSPORT=http
      - PORT=8080
      - HOST=0.0.0.0
      - MCP_AUTH_MODE=${MCP_AUTH_MODE:-multi}
      - MCP_AUTH_TOKEN_HASH=${MCP_AUTH_TOKEN_HASH:-}
      - MCP_USERS_FILE=${MCP_USERS_FILE:-}
      - MCP_RPM=${MCP_RPM:-}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - notion-data:/data
volumes:
  notion-data:
