name: CI

on:
  # Public repo (spec 2026-10-30): ci.yml may also start by itself, because Actions minutes
  # are free on a public repo. cd.yml stays dispatch-only on every repo. ci_policy_lint.py
  # allows these triggers in ci.yml of a public repo only. `sha` is read by the
  # main-integrity job only.
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review, edited ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit for the main-integrity job to verify (default: the tip of the dispatched ref)"
        required: false
        type: string
        default: ""
permissions:
  contents: read
  pull-requests: write

# `edited` (kept so pr-title re-checks a retitled PR) gets its own group: in the
# shared group a title or body edit would cancel the in-flight test run of the
# same PR, while the `edited` run itself skips every job except pr-title.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && 'edited' || 'code' }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # PR Title Lint (Conventional Commits subset)
  # ============================================================================
  # Squash-merge uses the PR title as the commit subject and bypasses the
  # local enforce-commit pre-commit commit-msg hook (bot PRs never run local
  # git hooks). Without a server-side check, a bot title like
  # "Sentinel: [HIGH] Fix ..." squash-merges with a non-conventional subject
  # -> PSR's commit parser silently ignores it -> no version bump, even for a
  # security fix. This job only surfaces a red check; it does not block
  # merge (no required-status-check rule), so the person merging still must
  # retype the squash-commit subject to start with fix:/feat: when this is red.
  pr-title:
    name: Validate PR title (Conventional Commits subset)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Repo rule: only feat: and fix: (feedback_commit_prefix.md). This is
          # narrower than PSR's own default allowed_tags (which also treats
          # perf: as patch-worthy) -- we enforce the project convention here,
          # not just what PSR itself would accept.
          types: |
            fix
            feat
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must not start with an uppercase character.

  lint-and-test:
    name: Lint, Test & Build (${{ matrix.os }}, Node ${{ matrix.node-version }})
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'edited')
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        node-version: [ "26" ]
        include:
          - os: ubuntu-latest
            node-version: "22"
          - os: ubuntu-latest
            node-version: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write
      # The Codecov upload authenticates with this job's OIDC token.
      id-token: write
    steps:
      - name: Harden Runner
        if: matrix.os == 'ubuntu-latest'
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Node LTS row
        run: node -e "const v = process.versions.node.split('.')[0]; if (v !== '${{ matrix.node-version }}') throw new Error('Expected Node ' + '${{ matrix.node-version }}' + ', got ' + process.versions.node)"

      - name: Setup uv and Python 3.13
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test SessionStart hook
        run: uv run --with pytest==9.0.3 python -m pytest hooks/tests -q

      - name: Run Biome check
        run: bun run check

      - name: Run tests with coverage
        run: bun run test -- --coverage

      # Codecov refuses a tokenless upload for the default branch, and no upload token
      # is stored, so the upload authenticates with OIDC and fails the job when Codecov
      # refuses it. Pull requests skip it: a fork or Dependabot run cannot always mint
      # an OIDC token, and the required check must not depend on Codecov being reachable.
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.node-version == '26'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: true

      - name: Build project
        run: bun run build

  readme-sync:
    name: Verify README registry metadata
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'edited')
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Verify README registry metadata
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  lint-and-test-summary:
    name: Lint, Test & Build (ubuntu-latest)
    needs: [ lint-and-test ]
    if: always() && needs.lint-and-test.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
      - name: Assert matrix result
        run: |
          if [ "${{ needs.lint-and-test.result }}" != "success" ]; then
            echo "lint-and-test matrix result: ${{ needs.lint-and-test.result }}"
            exit 1
          fi
