# Pre-commit Hooks Configuration
# Installation: https://pre-commit.com/
#
# Quick start:
#   1. Install pre-commit: uv pip install pre-commit
#   2. Install hooks: pre-commit install
#   3. Run manually: pre-commit run --all-files
#
# Bypass checks: git commit --no-verify (use only in emergency)

repos:
  # ============================================================================
  # Security: Secret Detection (MUST be first — blocks commit if secrets found)
  # ============================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (detect secrets)

  # ============================================================================
  # TypeScript/JavaScript
  # ============================================================================

  # Biome: Fast formatter and linter for JavaScript/TypeScript
  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: bun x biome check --write
        language: system
        types_or: [ javascript, ts, tsx, jsx, json, css ]
        pass_filenames: true

  # TypeScript: Type checker
  - repo: local
    hooks:
      - id: typescript-check
        name: typescript type check
        entry: bun x tsc --noEmit
        language: system
        types: [ ts ]
        pass_filenames: false

  # Test: Run tests
  - repo: local
    hooks:
      - id: test
        name: test (TypeScript)
        entry: bun run test
        language: system
        types: [ ts ]
        pass_filenames: false

  # ============================================================================
  # Common Checks
  # ============================================================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # v5.0.0
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        exclude_types: [ image ]

      - id: check-merge-conflict
        name: check for merge conflicts

      - id: check-json
        name: check JSON files
        types: [ json ]

      - id: check-yaml
        name: check YAML files
        types: [ yaml ]

      - id: check-toml
        name: check TOML files
        types: [ toml ]

      - id: end-of-file-fixer
        name: fix end of files
        exclude_types: [ image ]

  # ============================================================================
  # Registry metadata: keep npm and MCP Registry descriptions in sync
  # ============================================================================
  - repo: local
    hooks:
      - id: verify-readme-sync
        name: Verify README registry metadata
        entry: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.
        language: system
        pass_filenames: false

  # ============================================================================
  # Commit Message Enforcement
  # ============================================================================
  - repo: local
    hooks:
      - id: enforce-commit
        name: Enforce feat and fix commit prefixes
        entry: bash scripts/enforce-commit.sh
        language: system
        stages: [ commit-msg ]
